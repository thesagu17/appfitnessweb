<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login Simple</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card" role="main">
  <h1>Iniciar sesión</h1>
  <p class="lead">Accede con tu correo y contraseña.</p>

  <form id="loginForm" novalidate>
    <div class="row">
      <label for="email">Correo</label>
      <input id="email" class="input" type="email" placeholder="tucorreo@ejemplo.com" required />
    </div>

    <div class="row">
      <label for="password">Contraseña</label>
      <div style="display:flex; gap:8px; align-items:center">
        <input id="password" class="input" type="password" placeholder="••••••••" required style="flex:1"/>
        <button type="button" id="toggle" class="btn secondary" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
    </div>

    <div class="row" style="display:flex; justify-content:space-between; align-items:center">
      <label class="show-pass"><input id="remember" type="checkbox"/> Recuérdame</label>
      <a href="#" class="helper">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="actions">
      <button class="btn" type="submit">Entrar</button>
    </div>

    <div id="message" class="msg" role="status" aria-live="polite"></div>
  </form>

  <footer>Prueba: <strong>demo@ejemplo.com</strong> / <strong>1234</strong></footer>
</main>

<script src="script.js"></script>
</body>
</html>
