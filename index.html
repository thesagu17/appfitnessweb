<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Simple</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card" role="main">
        <h1>Iniciar sesión</h1>
        <p class="lead">Accede con tu correo y contraseña.</p>

        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="row">
                <label for="email">Correo</label>
                <input id="email" class="input" type="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <!-- Password -->
            <div class="row">
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input id="password" class="input" type="password" placeholder="••••••••" required>
                    <button type="button" id="toggle" class="btn secondary" aria-label="Mostrar contraseña">Mostrar</button>
                </div>
            </div>

            <!-- Remember & Forgot -->
            <div class="row remember-forgot">
                <label class="show-pass">
                    <input id="remember" type="checkbox"> Recuérdame
                </label>
                <a href="#" class="helper">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Submit -->
            <div class="actions">
                <button class="btn" type="submit">Entrar</button>
            </div>

            <!-- Message -->
            <div id="message" class="msg" role="status" aria-live="polite"></div>
        </form>

        <footer>Prueba: <strong>@ejemplo.com</strong> / <strong>1234</strong></footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
